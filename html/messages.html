<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - Club Enrollment Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/supabase-support.js"></script>
  <script src="../js/supabase-storage.js"></script>
  <script src="../js/custom-dialogs.js?v=20260414-delete-2"></script>
  <link rel="stylesheet" href="../css/messages.css?v=20260414-layout-1" />
  <link rel="stylesheet" href="../css/portal-footer.css?v=20260415-footer-modal-1" />

</head>
<body>
  <header class="portal-header">
    <div class="container">
      <a class="brand" href="home.html">
        <span class="brand-mark">
          <img src="../zp/gywm.webp" alt="Platform logo" />
        </span>
        <span class="brand-text">
          <strong>Club Registration Portal</strong>
          <em>Booking platform for campus and community clubs</em>
        </span>
      </a>

      <nav class="top-nav" aria-label="Primary navigation">
        <a href="home.html">Home</a>
        <a href="Club-Preview.html">Club Preview</a>
        <a href="Club-Booking.html">Club Booking</a>
        <a href="Club-Courses.html">Club Courses</a>
        <a href="Club-Forum.html">Club Forum</a>
        <a href="Support-Center.html">Support Center</a>
      </nav>

      <div class="top-actions">
        <a class="top-btn light" href="join.html">Log in</a>
        <a class="top-btn accent" href="join.html?view=signup#auth-entry">Sign up</a>
      </div>
    </div>
  </header>

  <main class="messages-main">
    <div class="container">
      <section class="messages-shell" aria-label="Direct messages">
        <aside class="messages-sidebar">
          <div class="messages-sidebar-top">
            <div class="messages-self-card" id="messagesSelfCard"></div>
            <label class="messages-search">
              <span class="messages-search-icon" aria-hidden="true">⌕</span>
              <input id="conversationSearchInput" type="search" placeholder="Search contacts or messages" autocomplete="off" />
            </label>
          </div>
          <div class="messages-conversation-list" id="conversationList"></div>
        </aside>

        <section class="messages-panel">
          <div class="messages-panel-head" id="messagesPanelHead"></div>
          <div class="messages-thread" id="messagesThread"></div>
          <form class="messages-compose" id="messagesComposeForm">
            <div class="messages-compose-toolbar">
              <div class="messages-compose-tools">
                <button class="messages-tool-btn" type="button" id="messagesEmojiBtn" aria-label="Insert emoji">
                  <span class="messages-tool-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <circle cx="12" cy="12" r="8.5"></circle>
                      <path d="M8.7 14.1C9.5 15.3 10.7 16 12 16c1.3 0 2.5-.7 3.3-1.9"></path>
                      <circle cx="9.3" cy="10.2" r="1"></circle>
                      <circle cx="14.7" cy="10.2" r="1"></circle>
                    </svg>
                  </span>
                </button>
                <label class="messages-tool-btn" id="messagesImageTrigger" aria-label="Upload images">
                  <span class="messages-tool-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <rect x="4" y="5" width="16" height="14" rx="2"></rect>
                      <path d="M7 15l3.2-3.2 2.3 2.3 2.2-2.2L18 15"></path>
                      <circle cx="9" cy="9" r="1.3"></circle>
                    </svg>
                  </span>
                  <input id="messagesImageInput" type="file" accept="image/*" multiple hidden />
                </label>
                <label class="messages-tool-btn" id="messagesVideoTrigger" aria-label="Upload a video">
                  <span class="messages-tool-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <rect x="4" y="6" width="16" height="12" rx="2"></rect>
                      <path d="M9 6l2.3 3"></path>
                      <path d="M14.7 6 17 9"></path>
                      <path d="M9 18l2.3-3"></path>
                      <path d="M14.7 18 17 15"></path>
                    </svg>
                  </span>
                  <input id="messagesVideoInput" type="file" accept="video/*" hidden />
                </label>
                <button class="messages-tool-btn" type="button" id="messagesLinkBtn" aria-label="Add link">
                  <span class="messages-tool-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M9.5 12.5 14 8a3 3 0 1 1 4.2 4.2l-6.7 6.7a5 5 0 1 1-7.1-7.1l7-7"></path>
                    </svg>
                  </span>
                </button>
              </div>
              <div class="messages-emoji-picker" id="messagesEmojiPicker" hidden></div>
            </div>
            <div class="messages-compose-attachments" id="messagesComposeAttachments"></div>
            <div class="messages-compose-box">
              <textarea id="messagesComposeInput" placeholder="Type a message..." rows="1"></textarea>
              <button type="submit" id="messagesSendBtn">Send</button>
            </div>
            <div class="messages-compose-status" id="messagesComposeStatus"></div>
          </form>
        </section>
      </section>
    </div>
  </main>

  <footer class="portal-site-footer messages-page-footer">
    <div class="portal-site-footer__inner">
      <div class="portal-site-footer__links">
        <a class="portal-site-footer__link" href="Support-Center.html">Contact Us</a>
        <a class="portal-site-footer__link" href="#">Privacy Policy</a>
        <a class="portal-site-footer__link" href="#">Terms of Use</a>
        <a class="portal-site-footer__link" href="Club-Forum.html">Follow Us</a>
      </div>
      <div class="portal-site-footer__copyright">Copyright © beihong wang 2026</div>
    </div>
  </footer>

  <div class="messages-video-modal" id="messagesVideoModal" hidden>
    <div class="messages-video-modal-backdrop" data-close-video-modal></div>
    <div class="messages-video-modal-dialog" role="dialog" aria-modal="true" aria-label="Video preview">
      <button class="messages-video-modal-close" type="button" id="messagesVideoModalClose" aria-label="Close video preview">✕</button>
      <div class="messages-video-modal-stage">
        <video id="messagesVideoModalPlayer" controls playsinline preload="auto"></video>
      </div>
    </div>
  </div>

  <script src="../js/portal-header-auth.js?v=20260414-msgdb-2"></script>
  <script src="../js/portal-footer.js?v=20260415-footer-modal-1" defer></script>
  <script src="../js/messages.js?v=20260414-msgdb-1"></script>

</body>
</html>
